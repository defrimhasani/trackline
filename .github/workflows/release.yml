name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Work out the next version
        id: bump
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          current=$(node -p "require('./package.json').version")
          latest=$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -1)
          base=$(printf '%s\n%s\n' "$current" "${latest:-0.0.0}" | sort -V | tail -1)
          bump="${INPUT_BUMP:-patch}"
          case "$MESSAGE" in *'[major]'*) bump=major ;; *'[minor]'*) bump=minor ;; esac
          IFS=. read -r major minor patch <<< "$base"
          case "$bump" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            *)     next="$major.$minor.$((patch + 1))" ;;
          esac
          echo "Releasing $next ($bump bump from $base)"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Write the version into the project
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f));c.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
          perl -0pi -e 's/(\[package\]\nname = "trackline"\nversion = ")[^"]+/${1}$ENV{VERSION}/' src-tauri/Cargo.toml
          perl -0pi -e 's/(name = "trackline"\nversion = ")[^"]+/${1}$ENV{VERSION}/' src-tauri/Cargo.lock
          grep -q "^version = \"$VERSION\"" src-tauri/Cargo.toml || { echo "::error::Could not update src-tauri/Cargo.toml"; exit 1; }
          git diff --stat

      - name: Commit the version bump
        id: commit
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION [skip ci]"
          for attempt in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  create-release:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const { data: commits } = await github.rest.repos.listCommits({ owner: context.repo.owner, repo: context.repo.repo, sha: process.env.SHA, per_page: 30 });
            const changes = commits
              .map(commit => commit.commit.message.split('\n')[0])
              .filter(message => !message.startsWith('chore(release)'))
              .slice(0, 15)
              .map(message => `- ${message}`);
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: process.env.SHA,
              name: `Trackline ${tag}`,
              draft: true,
              generate_release_notes: false,
              body: [
                'A calm desktop timesheet for Jira Cloud.',
                '',
                '## Recent changes',
                ...changes,
                '',
                '## Downloads',
                '- **macOS (Apple Silicon):** `Trackline_*_aarch64.dmg`',
                '- **macOS (Intel):** `Trackline_*_x64.dmg`',
                '- **Windows:** `Trackline_*_x64-setup.exe` (or the `.msi`)',
                '- **Linux:** `.AppImage`, `.deb` or `.rpm`',
                '',
                '## First launch',
                'Trackline is not yet signed with a paid Apple or Microsoft certificate, so your system will warn you the first time.',
                '- **macOS:** open the app once, then go to System Settings → Privacy & Security and select **Open Anyway**. Alternatively run `xattr -dr com.apple.quarantine /Applications/Trackline.app`.',
                '- **Windows:** in the SmartScreen prompt select **More info → Run anyway**.',
                '',
                'Then open **Settings**, enter your Jira Cloud site, Atlassian email and an [API token](https://id.atlassian.com/manage-profile/security/api-tokens), and select **Connect Jira**.',
              ].join('\n'),
            });
            return data.id;

  build:
    needs: [version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Configure Apple signing and notarization
        if: matrix.platform == 'macos-latest'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$SIGNING_IDENTITY" ]; then
            echo "Apple signing secrets are not set. Building with an ad-hoc signature."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$NOTARY_APPLE_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Notarization secrets are not set. The app will be signed but not notarized."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number('${{ needs.create-release.outputs.release_id }}'),
              draft: false,
              make_latest: 'true',
            });
