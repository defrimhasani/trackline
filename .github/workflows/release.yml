name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Work out the next version
        id: bump
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          current=$(node -p "require('./package.json').version")
          latest=$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -1)
          base=$(printf '%s\n%s\n' "$current" "${latest:-0.0.0}" | sort -V | tail -1)
          bump="${INPUT_BUMP:-patch}"
          case "$MESSAGE" in *'[major]'*) bump=major ;; *'[minor]'*) bump=minor ;; esac
          IFS=. read -r major minor patch <<< "$base"
          case "$bump" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            *)     next="$major.$minor.$((patch + 1))" ;;
          esac
          echo "Releasing $next ($bump bump from $base)"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Write the version into the project
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f));c.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
          perl -0pi -e 's/(\[package\]\nname = "trackline"\nversion = ")[^"]+/${1}$ENV{VERSION}/' src-tauri/Cargo.toml
          perl -0pi -e 's/(name = "trackline"\nversion = ")[^"]+/${1}$ENV{VERSION}/' src-tauri/Cargo.lock
          grep -q "^version = \"$VERSION\"" src-tauri/Cargo.toml || { echo "::error::Could not update src-tauri/Cargo.toml"; exit 1; }
          if [ -f CHANGELOG.md ] && grep -q '^## Unreleased' CHANGELOG.md; then
            perl -pi -e 's/^## Unreleased\s*$/## v$ENV{VERSION} — '"$(date -u +%Y-%m-%d)"'\n/' CHANGELOG.md
          fi
          git diff --stat

      - name: Commit the version bump
        id: commit
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION [skip ci]"
          for attempt in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  create-release:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const tag = `v${process.env.VERSION}`;
            let notes = '';
            if (fs.existsSync('CHANGELOG.md')) {
              const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n');
              const start = lines.findIndex(line => line.trim() === `## ${tag}` || line.startsWith(`## ${tag} `));
              if (start >= 0) {
                const end = lines.findIndex((line, index) => index > start && line.startsWith('## '));
                notes = lines.slice(start + 1, end === -1 ? undefined : end).join('\n').trim().replace(/^### /gm, '## ');
              }
            }
            if (!notes) {
              const { data: commits } = await github.rest.repos.listCommits({ owner: context.repo.owner, repo: context.repo.repo, sha: process.env.SHA, per_page: 30 });
              notes = ['## Recent changes', ...commits
                .map(commit => commit.commit.message.split('\n')[0])
                .filter(message => !message.startsWith('chore(release)'))
                .slice(0, 15)
                .map(message => `- ${message}`)].join('\n');
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: process.env.SHA,
              name: `Trackline ${tag}`,
              draft: true,
              generate_release_notes: false,
              body: [
                'A calm desktop timesheet for Jira Cloud.',
                '',
                notes,
                '',
                '## Downloads',
                '- **macOS (Apple Silicon):** `Trackline_*_aarch64.dmg`',
                '- **macOS (Intel):** `Trackline_*_x64.dmg`',
                '- **Windows:** `Trackline_*_x64-setup.exe` (or the `.msi`)',
                '- **Linux:** `.AppImage`, `.deb` or `.rpm`',
                '',
                '## First launch',
                'Trackline is not yet signed with a paid Apple or Microsoft certificate, so your system will warn you the first time.',
                '- **macOS:** open the app once, then go to System Settings → Privacy & Security and select **Open Anyway**. Alternatively run `xattr -dr com.apple.quarantine /Applications/Trackline.app`.',
                '- **Windows:** in the SmartScreen prompt select **More info → Run anyway**.',
                '',
                'Then open **Settings**, enter your Jira Cloud site, Atlassian email and an [API token](https://id.atlassian.com/manage-profile/security/api-tokens), and select **Connect Jira**.',
              ].join('\n'),
            });
            return data.id;

  build:
    needs: [version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Configure Apple signing and notarization
        if: matrix.platform == 'macos-latest'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$SIGNING_IDENTITY" ]; then
            echo "Apple signing secrets are not set. Building with an ad-hoc signature."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$NOTARY_APPLE_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Notarization secrets are not set. The app will be signed but not notarized."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: false

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish update manifest and release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number('${{ needs.create-release.outputs.release_id }}');
            const { data: release } = await github.rest.repos.getRelease({ owner, repo, release_id });
            const targets = [
              ['darwin-aarch64', name => name.endsWith('aarch64.app.tar.gz')],
              ['darwin-x86_64', name => name.endsWith('x64.app.tar.gz')],
              ['windows-x86_64', name => name.endsWith('-setup.exe')],
              ['linux-x86_64', name => name.endsWith('.AppImage')],
            ];
            const platforms = {};
            for (const [platform, matches] of targets) {
              const bundle = release.assets.find(asset => matches(asset.name));
              const signature = bundle && release.assets.find(asset => asset.name === `${bundle.name}.sig`);
              if (!bundle || !signature) { core.warning(`No signed update bundle for ${platform}.`); continue; }
              const { data } = await github.rest.repos.getReleaseAsset({ owner, repo, asset_id: signature.id, headers: { accept: 'application/octet-stream' } });
              platforms[platform] = {
                signature: Buffer.from(data).toString('utf8').trim(),
                url: `https://github.com/${owner}/${repo}/releases/download/${release.tag_name}/${encodeURIComponent(bundle.name)}`,
              };
            }
            if (!Object.keys(platforms).length) { core.setFailed('No signed update bundles were found.'); return; }
            const notes = (release.body || '').split('\n## Downloads')[0].replace(/^A calm desktop timesheet for Jira Cloud\.\s*/, '').trim();
            const manifest = { version: release.tag_name.replace(/^v/, ''), notes, pub_date: new Date().toISOString(), platforms };
            const existing = release.assets.find(asset => asset.name === 'latest.json');
            if (existing) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
            await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id, name: 'latest.json', data: JSON.stringify(manifest, null, 2), headers: { 'content-type': 'application/json' } });
            core.info(`Update manifest for ${Object.keys(platforms).join(', ')}`);
            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false, make_latest: 'true' });
